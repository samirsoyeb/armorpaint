name: Linux (Vulkan)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install System Graphics Tools
        run: |
          sudo apt-get update
          sudo apt install make clang libvulkan-dev libgtk-3-dev --yes --quiet
      - name: Build Application
        run: |
          # Move directly into the painting repository folder
          cd paint
          # Run the engine compiler using the backward tool path
          ../base/make --compile
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-1.0
          path: paint/build/krom/
