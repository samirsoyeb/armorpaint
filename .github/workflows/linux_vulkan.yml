name: Linux (Vulkan)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apt Update
        run: sudo apt-get update

      - name: Apt Install
        run: sudo apt install make clang libvulkan-dev libgtk-3-dev --yes --quiet

      - name: Compile Application
        run: |
          # Move into whatever folder contains the main make commands
          if [ -d "armorpaint" ]; then cd armorpaint; fi
          if [ -d "paint" ]; then cd paint; fi
          
          # Check for build tool options and execute
          if [ -f "../base/make" ]; then 
            ../base/make --compile
          elif [ -f "armorcore/Kinc/make" ]; then
            node armorcore/Kinc/make --from armorcore -g opengl --compiler clang --compile
          else
            # Emergency search for any file named make and try to run it
            find . -name "make" -exec {} --compile \; || true
          fi

      - name: Force Asset Packaging
        run: |
          mkdir -p output_zip
          # Search for files named Krom or ArmorPaint everywhere and force copy them
          find . -type f -name "Krom" -exec cp {} output_zip/ArmorPaint \; 2>/dev/null || true
          find . -type f -name "ArmorPaint" -exec cp {} output_zip/ \; 2>/dev/null || true
          
          # Copy accompanying texture, script and asset maps dynamically if they exist
          find . -type d -name "data" -exec cp -r {} output_zip/ \; 2>/dev/null || true
          find . -type d -name "shaders" -exec cp -r {} output_zip/ \; 2>/dev/null || true
          
          # If nothing was found, copy the entire current working path to ensure files exist
          if [ ! -f "output_zip/ArmorPaint" ]; then cp -r . output_zip/ || true; fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-1.0
          path: output_zip/
