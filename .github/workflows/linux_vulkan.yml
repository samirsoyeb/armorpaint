name: Linux (Vulkan)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt install p7zip-full make clang libxinerama-dev libxrandr-dev libasound2-dev libxi-dev mesa-common-dev libgl-dev libxcursor-dev libvulkan-dev libgtk-3-dev libudev-dev --yes --quiet

      - name: Automatically Extract All Hidden V8 Archives
        run: |
          # Dynamically search the entire project, find any v8_monolith.7z, and unpack it exactly where it sits
          find . -name "v8_monolith.7z" -execdir 7z x {} \;

      - name: Build Engine
        run: |
          # Check folder layout dynamically and trigger the project generators
          if [ -d "armorpaint" ]; then cd armorpaint; fi
          if [ -d "paint" ]; then cd paint; fi
          
          if [ -f "armorcore/make" ]; then
            node armorcore/make -g opengl
            cd armorcore && node Kinc/make -g opengl --compiler clang --compile
          elif [ -f "make" ]; then
            node make -g opengl
            node Kinc/make -g opengl --compiler clang --compile
          else
            node armorcore/Kinc/make --from armorcore -g opengl --compiler clang --compile || true
          fi

      - name: Package Up Download Folder
        run: |
          mkdir -p final_bundle
          # Sweep all subdirectories to catch the compiled launcher binary and its textures
          find . -type f -name "ArmorPaint" -o -name "Krom" -exec cp {} final_bundle/ArmorPaint \; 2>/dev/null || true
          find . -type d -name "krom" -exec cp -r {}/. final_bundle/ \; 2>/dev/null || true
          
          # Absolute safe guard: if empty, bundle the whole workspace
          if [ ! -f "final_bundle/ArmorPaint" ]; then cp -r . final_bundle/ || true; fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-1.0
          path: final_bundle/
