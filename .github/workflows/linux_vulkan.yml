name: Linux (Vulkan)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apt Update
        run: sudo apt-get update

      - name: Apt Install
        run: sudo apt install make clang libvulkan-dev libgtk-3-dev --yes --quiet

      - name: Compile
        run: |
          cd paint
          ../base/make --compile

      - name: Locate and Package Output Assets
        run: |
          mkdir -p final_bundle
          # Search for the compiled binary or the deployment folder dynamically
          find . -name "ArmorPaint" -o -name "Krom" -o -name "krom"
          # Copy everything from the actual asset workspace
          cp -r paint/build/krom/* final_bundle/ || cp -r build/krom/* final_bundle/ || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-1.0
          path: final_bundle/
