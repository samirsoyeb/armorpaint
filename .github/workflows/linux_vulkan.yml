name: Linux (Vulkan)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apt Update
        run: sudo apt-get update

      - name: Apt Install
        run: sudo apt install make clang libvulkan-dev libgtk-3-dev --yes --quiet

      - name: Compile
        run: |
          # Dynamically look for the folder containing the make script and enter it
          TARGET_DIR=$(find . -maxdepth 2 -name "base" -o -name "armorcore" | head -n 1)
          if [ -d "armorpaint" ]; then cd armorpaint; elif [ -d "paint" ]; then cd paint; fi
          
          # Run the standard engine compiler
          if [ -f "../base/make" ]; then ../base/make --compile; else node armorcore/Kinc/make --from armorcore -g opengl --compiler clang --compile; fi

      - name: Locate and Package Output Assets
        run: |
          mkdir -p final_bundle
          # Aggressively copy any compiled krom folders found anywhere in the workspace
          find . -type d -name "krom" -exec cp -r {}/. final_bundle/ \; 2>/dev/null || true
          # Make sure the executable is named correctly if found
          find final_bundle/ -name "Krom" -exec mv {} final_bundle/ArmorPaint \; 2>/dev/null || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-1.0
          path: final_bundle/
